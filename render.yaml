# Render Blueprint. Demo mode: one container runs Apache + PHP + MariaDB and seeds demo data on boot.
# Data is ephemeral on the free plan (it resets whenever the service restarts or wakes from sleep).
services:
  - type: web
    name: ffms
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ffms/api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SEED_ON_START
        value: "1"
      - key: CURRENCY
        value: ZMW
      - key: WEATHER_LIVE
        value: "1"
      # --- To use a persistent external MySQL/MariaDB instead of the built-in demo database, set these and SEED_ON_START=0:
      # - key: DB_HOST      (e.g. your TiDB Cloud / Aiven host)
      # - key: DB_PORT
      # - key: DB_NAME
      # - key: DB_USER
      # - key: DB_PASS
      #   sync: false
      # - key: DB_SSL
      #   value: "1"
